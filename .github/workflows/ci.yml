name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, next]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "manifest/**"
      - "docs/**"
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"

# A newer PR event supersedes its checks and comment update. Push runs are independent.
# Grouping at workflow entry prevents an older, slower check from evicting a newer update.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Set the new value when the cache grows too much and we hit the runner's disk space limit
  # via https://github.com/rust-lang/docs.rs/pull/2433
  RUST_CACHE_KEY: rust-cache-20260312

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - &install-rust
        name: Install Rust
        run: |
          rustup update --no-self-update stable nightly
          rustup component add --toolchain nightly rustfmt
          rustc --version
      - &install-cargo-make
        name: Install cargo-make
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-make@0.37.24
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Use a common cache for the basic compilation/formatter/clippy checks
          shared-key: ${{ github.workflow }}-shared
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: |
          cargo make clippy

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Run this job after the linter, so the cache is hot
    needs: [lint]
    # But run this check even if the lint check failed
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Use a common cache for the basic compilation/formatter/clippy checks
          shared-key: ${{ github.workflow }}-shared
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          # But do not save this cache, just use it
          save-if: false
      - name: Formatting
        run: |
          cargo make check-format

  check_manifest:
    name: check manifest
    # Pushes are checked by check-manifest.yml's own trigger, which also sees manifest-only
    # pushes that this workflow ignores.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/check-manifest.yml
    with:
      # The base as it was when the pull request was last updated: the merge commit being
      # checked was built on it, so the comparison does not shift when the base branch moves.
      against: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.base.sha }}/manifest/v3/manifest.json

  manifest_diff_comment:
    name: manifest diff comment
    # Keeps one comment on the pull request listing its manifest changes, removed once there are
    # none. Only after a passing check. Pull requests from forks get a read-only token, so they
    # only have the job summary.
    needs: [check_manifest]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post, update or remove the comment
        env:
          GH_TOKEN: ${{ github.token }}
          DIFF: ${{ needs.check_manifest.outputs.diff }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha)
          if [ "${current_head}" != "${HEAD_SHA}" ]; then
            echo 'Skipping the manifest summary for an obsolete pull request revision'
            exit 0
          fi
          marker='<!-- manifest-diff -->'
          existing=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1)
          if [ -z "${DIFF}" ]; then
            if [ -n "${existing}" ]; then
              gh api -X DELETE "repos/${REPO}/issues/comments/${existing}"
            fi
            exit 0
          fi
          body=$(printf '%s\n### Manifest changes\n\n%s\n' "${marker}" "${DIFF}")
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="${body}" > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="${body}" > /dev/null
          fi

  unit_tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # NOTE: We use a different cache for the tests, so they can be run in parallel, but we
          # also share the cache for the tests for efficiency
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Check
        # We run `cargo check` to verify that the workspace compiles correctly before attempting
        # to execute the tests from each crate. This produces easier to read output if a compilation
        # error occurs
        run: cargo make test-build
      - name: Test
        run: cargo make unit-test

  integration_test:
    name: integration tests
    # We only want to run the integration tests if the unit tests pass, and that has the added
    # benefit that we can re-use the cache from the unit test job for all integration tests
    needs: [unit_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The pre-release checks compare against the merge commit's base parent
          fetch-depth: 2
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Install all rustup toolchains present in the manifest
        run: |
          ./.github/auxiliary_scripts/install-toolchains.sh
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          # Do not persist the cache, leave that to the unit tests, we just use the cache here
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Check
        # We run `cargo check` to verify that the workspace compiles correctly before attempting
        # to execute the tests from each crate. This produces easier to read output if a compilation
        # error occurs
        run: cargo make test-build
      - name: Test
        run: cargo make integration-test

  prerelease_test:
    name: pre-release checks (${{ matrix.os }})
    # These install real components from this repo's copy of the manifest and run them, so it
    # takes many minutes. Run them on main, on pull requests into main (the release path from
    # next), and on explicitly labelled pull requests, on both targets midenup is released for
    if: ${{ github.ref_name == 'main' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'check:install') }}
    needs: [integration_test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Install all rustup toolchains present in the manifest
        run: |
          ./.github/auxiliary_scripts/install-toolchains.sh
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Pre-release checks
        # A pull request that changes nothing outside `manifest/` installs only the toolchains
        # changed since its base; any other change, and every push to main, tests every network's
        # toolchain. `HEAD^1` is the base side of the pull request's merge commit
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && git diff --quiet HEAD^1 HEAD -- ':!manifest'; then
            git show HEAD^1:manifest/v3/manifest.json > "$RUNNER_TEMP/previous-manifest.json"
            export PRERELEASE_AGAINST="file://$RUNNER_TEMP/previous-manifest.json"
          fi
          cargo make prerelease-test

  acceptance:
    name: acceptance tests (${{ matrix.os }})
    # Runs the scenarios in acceptance/ that require a component this pull request changes, against
    # the toolchains it changes, on both targets midenup is released for. Scenarios that need Docker
    # are skipped on macOS, which lacks it.
    if: github.event_name == 'pull_request'
    needs: [unit_tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: litcheck
      - name: Acceptance tests
        env:
          AGAINST: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.base.sha }}/manifest/v3/manifest.json
        run: |
          cargo build -p midenup -p manifest-utils
          ./target/debug/manifest-utils acceptance --manifest-path manifest/v3/manifest.json --against "${AGAINST}" --midenup target/debug/midenup
