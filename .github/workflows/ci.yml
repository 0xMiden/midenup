name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, next]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "manifest/**"
      - "docs/**"
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"
env:
  # Set the new value when the cache grows too much and we hit the runner's disk space limit
  # via https://github.com/rust-lang/docs.rs/pull/2433
  RUST_CACHE_KEY: rust-cache-20260312

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - &install-rust
        name: Install Rust
        run: |
          rustup update --no-self-update stable nightly
          rustup component add --toolchain nightly rustfmt
          rustc --version
      - &install-cargo-make
        name: Install cargo-make
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-make@0.37.24
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Use a common cache for the basic compilation/formatter/clippy checks
          shared-key: ${{ github.workflow }}-shared
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: |
          cargo make clippy

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Run this job after the linter, so the cache is hot
    needs: [lint]
    # But run this check even if the lint check failed
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Use a common cache for the basic compilation/formatter/clippy checks
          shared-key: ${{ github.workflow }}-shared
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          # But do not save this cache, just use it
          save-if: false
      - name: Formatting
        run: |
          cargo make check-format

  unit_tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # NOTE: We use a different cache for the tests, so they can be run in parallel, but we
          # also share the cache for the tests for efficiency
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Check
        # We run `cargo check` to verify that the workspace compiles correctly before attempting
        # to execute the tests from each crate. This produces easier to read output if a compilation
        # error occurs
        run: cargo make test-build
      - name: Test
        run: cargo make unit-test

  integration_test:
    name: integration tests
    # We only want to run the integration tests if the unit tests pass, and that has the added
    # benefit that we can re-use the cache from the unit test job for all integration tests
    needs: [unit_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Install all rustup toolchains present in the manifest
        run: |
          ./.github/auxiliary_scripts/install-toolchains.sh
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          # Do not persist the cache, leave that to the unit tests, we just use the cache here
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Check
        # We run `cargo check` to verify that the workspace compiles correctly before attempting
        # to execute the tests from each crate. This produces easier to read output if a compilation
        # error occurs
        run: cargo make test-build
      - name: Test
        run: cargo make integration-test
      - name: Pre-release checks
        # These install real components from this repo's copy of the manifest and run them, so it
        # takes many minutes. Run them on main or on explicitly labelled PRs
        if: ${{ github.ref_name == 'main' || contains(github.event.pull_request.labels.*.name, 'check:install') }}
        run: cargo make prerelease-test

  upgrade_test:
    name: upgrade from releases (${{ matrix.os }})
    # A home built by a released midenup must keep working once this build replaces it. The
    # minimum supported and latest releases on every run; every release on the way to main.
    needs: [unit_tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - *install-rust
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - name: Upgrade from each release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          ALL_RELEASES: ${{ github.ref_name == 'main' || github.base_ref == 'main' }}
        run: |
          set -euo pipefail
          if [ "${ALL_RELEASES}" = "true" ]; then
            tags=$(gh release list --exclude-pre-releases --exclude-drafts --limit 100 --json tagName --jq '.[].tagName')
          else
            tags="v$(jq -r .min_client_version manifest/v3/manifest.json) $(gh release view --json tagName --jq .tagName)"
          fi
          cargo test --test upgrade --no-run
          for tag in $(printf '%s\n' ${tags} | sort -u); do
            echo "::group::upgrade from ${tag}"
            mkdir -p "${RUNNER_TEMP}/${tag}"
            gh release download "${tag}" --pattern "midenup-${TARGET}.tar.gz" --output - | tar xz -C "${RUNNER_TEMP}/${tag}"
            MIDENUP_UPGRADE_FROM="${RUNNER_TEMP}/${tag}/midenup" cargo test --test upgrade
            echo "::endgroup::"
          done
