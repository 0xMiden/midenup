name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, next]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "manifest/**"
      - "docs/**"
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"
env:
  # Set the new value when the cache grows too much and we hit the runner's disk space limit
  # via https://github.com/rust-lang/docs.rs/pull/2433
  RUST_CACHE_KEY: rust-cache-20260312

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - &install-rust
        name: Install Rust
        run: |
          rustup update --no-self-update stable nightly
          rustup component add --toolchain nightly rustfmt
          rustc --version
      - &install-cargo-make
        uses: taiki-e/install-action@cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Use a common cache for the basic compilation/formatter/clippy checks
          shared-key: ${{ github.workflow }}-shared
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: |
          cargo make clippy

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Run this job after the linter, so the cache is hot
    needs: [lint]
    # But run this check even if the lint check failed
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Use a common cache for the basic compilation/formatter/clippy checks
          shared-key: ${{ github.workflow }}-shared
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          # But do not save this cache, just use it
          save-if: false
      - name: Formatting
        run: |
          cargo make check-format

  check_manifest:
    name: check manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.workflow }}-shared
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - name: Validate the channel manifest
        run: cargo make check-manifest
      - name: Check the manifest against the one it replaces
        # A deliberate downgrade is acknowledged with a label on the pull request. A push has
        # already been reviewed that way, so it is allowed there.
        env:
          BASE: ${{ github.base_ref || github.event.before }}
          ALLOW_DOWNGRADE: ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'manifest:allow-downgrade')) && '--allow-downgrade' || '' }}
        run: |
          set -euo pipefail
          if ! git fetch --depth=1 origin "${BASE}"; then
            echo "::error::cannot fetch ${BASE}, the manifest this change replaces; was the branch force-pushed?"
            exit 1
          fi
          git show FETCH_HEAD:manifest/channel-manifest.json > "${RUNNER_TEMP}/base-manifest.json"
          # ALLOW_DOWNGRADE is deliberately unquoted: it is either a flag or nothing
          # shellcheck disable=SC2086
          cargo make check-manifest --against "file://${RUNNER_TEMP}/base-manifest.json" ${ALLOW_DOWNGRADE}
      - name: How to allow a deliberate downgrade
        if: ${{ failure() && github.event_name == 'pull_request' }}
        run: echo "::notice::If the check refused a network moving to an older toolchain and that is intended, add the 'manifest:allow-downgrade' label to this pull request and it re-runs."

  unit_tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # NOTE: We use a different cache for the tests, so they can be run in parallel, but we
          # also share the cache for the tests for efficiency
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Check
        # We run `cargo check` to verify that the workspace compiles correctly before attempting
        # to execute the tests from each crate. This produces easier to read output if a compilation
        # error occurs
        run: cargo make test-build
      - name: Test
        run: cargo make unit-test

  integration_test:
    name: integration tests
    # We only want to run the integration tests if the unit tests pass, and that has the added
    # benefit that we can re-use the cache from the unit test job for all integration tests
    needs: [unit_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - *install-rust
      - *install-cargo-make
      - name: Install all rustup toolchains present in the manifest
        run: |
          ./.github/auxiliary_scripts/install-toolchains.sh
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          # Do not persist the cache, leave that to the unit tests, we just use the cache here
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Check
        # We run `cargo check` to verify that the workspace compiles correctly before attempting
        # to execute the tests from each crate. This produces easier to read output if a compilation
        # error occurs
        run: cargo make test-build
      - name: Test
        run: cargo make integration-test
      - name: Pre-release checks
        # These install real components from this repo's copy of the manifest and run them, so it
        # takes many minutes. Run them on main, on pull requests into main (the release path from
        # next), and on explicitly labelled pull requests
        if: ${{ github.ref_name == 'main' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'check:install') }}
        run: cargo make prerelease-test
