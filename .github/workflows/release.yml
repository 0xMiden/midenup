name: release

on:
  workflow_dispatch:

permissions: {}

env:
  RUSTUP_TOOLCHAIN: stable
  GH_REPO: ${{ github.repository }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      subject: ${{ github.sha }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      pending: ${{ steps.check.outputs.pending }}
      excludes: ${{ steps.check.outputs.excludes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Validate the release commit
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
      - name: Check versions and registry state
        id: check
        run: bash scripts/check-release.sh --release

  verify:
    name: verify
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/release-verify.yml
    with:
      ref: ${{ needs.plan.outputs.subject }}
      full: true

  artifacts:
    name: build ${{ matrix.binary }} (${{ matrix.target }})
    needs: [plan, verify]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, binary: midenup }
          - { runner: macos-15, target: aarch64-apple-darwin, binary: midenup }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.subject }}
          persist-credentials: false
      - *install-rust
      - name: Build and smoke test
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          rustup target add --toolchain stable "$TARGET"
          cargo build --release --locked --target "$TARGET" -p "$BINARY" --bin "$BINARY"
          "target/$TARGET/release/$BINARY" --version
          tar -czf "$RUNNER_TEMP/$BINARY-$TARGET.tar.gz" -C "target/$TARGET/release" "$BINARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ matrix.binary }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  installer:
    name: stage installer
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.subject }}
          persist-credentials: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-installer
          path: bin/installer.sh
          if-no-files-found: error

  attest:
    name: attest artifacts
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: artifact-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/artifacts/*.tar.gz

  stage-artifacts:
    name: stage drafts
    needs: [plan, artifacts, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: artifact-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - name: Stage and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish); then
            [[ "$(jq -r .isDraft <<< "$draft")" == true ]]
            [[ "$(jq -r .targetCommitish <<< "$draft")" == "$GITHUB_SHA" ]]
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --generate-notes --prerelease="$PRERELEASE"
          fi
          cd "$RUNNER_TEMP/artifacts"
          sha256sum ./* > "$RUNNER_TEMP/checksums.sha256"
          gh release upload "$RELEASE_TAG" ./* "$RUNNER_TEMP/checksums.sha256" --clobber
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/readback"
          cd "$RUNNER_TEMP/readback"
          cmp checksums.sha256 "$RUNNER_TEMP/checksums.sha256"
          sha256sum --check "$RUNNER_TEMP/checksums.sha256"
          [[ "$(find . -type f | wc -l)" -eq "$(($(wc -l < "$RUNNER_TEMP/checksums.sha256") + 1))" ]]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-checksums
          path: ${{ runner.temp }}/checksums.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: [plan, verify, stage-artifacts, attest]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.subject }}
          persist-credentials: false
      - *install-rust
      - name: Check release refs and configure Cargo
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$GITHUB_SHA" ]]
          fi
          if [[ -e .cargo || -L .cargo ]]; then
            mv .cargo "$RUNNER_TEMP/source-cargo-config"
          fi
          {
            echo "CARGO_HOME=$RUNNER_TEMP/publish-cargo-home"
            echo 'RUSTC=rustc'
            echo 'RUSTC_WRAPPER='
            echo 'RUSTC_WORKSPACE_WRAPPER='
          } >> "$GITHUB_ENV"
      - name: Obtain a Trusted Publishing token
        if: needs.plan.outputs.pending == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish workspace crates
        if: needs.plan.outputs.pending == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXCLUDES: ${{ needs.plan.outputs.excludes }}
        run: |
          set -euo pipefail
          read -r -a excludes <<< "$EXCLUDES"
          cargo publish --workspace --locked --no-verify "${excludes[@]}"

  finalize:
    name: finalize
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.subject }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-checksums
          path: ${{ runner.temp }}/expected
      - name: Verify assets and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish)
          [[ "$(jq -r .isDraft <<< "$draft")" == true ]]
          [[ "$(jq -r .targetCommitish <<< "$draft")" == "$GITHUB_SHA" ]]
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/readback"
          cd "$RUNNER_TEMP/readback"
          cmp checksums.sha256 "$RUNNER_TEMP/expected/checksums.sha256"
          sha256sum --check "$RUNNER_TEMP/expected/checksums.sha256"
          [[ "$(find . -type f | wc -l)" -eq "$(($(wc -l < "$RUNNER_TEMP/expected/checksums.sha256") + 1))" ]]
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin refs/heads/main
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$GITHUB_SHA" ]]
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          fi
          latest=true
          if [[ "$PRERELEASE" == true ]]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"

  smoke:
    name: Run smoke tests
    needs: [plan, finalize]
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    with:
      release: ${{ needs.plan.outputs.tag }}
