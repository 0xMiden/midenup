name: check manifest

on:
  workflow_call:
    inputs:
      against:
        description: URI of the manifest this change replaces
        required: true
        type: string
      allow-downgrade:
        description: Accept a network or component moving to an older version, a removed toolchain, or a changed installation method
        required: false
        default: false
        type: boolean
  # ci.yml ignores manifest-only pushes, so those are checked here directly. A push to next
  # was reviewed on a pull request, where a downgrade is acknowledged by label, so it is allowed.
  push:
    branches: [next]
    paths:
      - manifest/**

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version
      - uses: taiki-e/install-action@cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-manifest
      - name: Validate the channel manifest
        run: cargo make check-manifest
      - name: Check the manifest against the one it replaces
        env:
          # On a push, the manifest at the previous tip of the branch
          AGAINST: ${{ inputs.against || format('https://raw.githubusercontent.com/{0}/{1}/manifest/v3/manifest.json', github.repository, github.event.before) }}
          ALLOW_DOWNGRADE: ${{ (inputs.allow-downgrade || github.event_name == 'push') && '--allow-downgrade' || '' }}
        run: |
          set -euo pipefail
          # ALLOW_DOWNGRADE is deliberately unquoted: it is either a flag or nothing
          # shellcheck disable=SC2086
          cargo make check-manifest --against "${AGAINST}" ${ALLOW_DOWNGRADE}
      - name: How to allow a deliberate downgrade
        if: ${{ failure() && github.event_name == 'pull_request' }}
        run: echo "::notice::If the check refused a downgrade, a removed toolchain or a changed installation method and that is intended, add the 'manifest:allow-downgrade' label to this pull request and it re-runs."
