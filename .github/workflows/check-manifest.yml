name: check manifest

on:
  workflow_call:
    inputs:
      against:
        description: URI of the manifest this change replaces
        required: true
        type: string
    outputs:
      diff:
        description: The changes to the manifest as a Markdown list, empty when there are none or a check failed
        value: ${{ jobs.check.outputs.diff }}
  # ci.yml ignores manifest-only pushes, so those are checked here directly.
  push:
    branches: [next]
    paths:
      - manifest/**

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      diff: ${{ steps.diff.outputs.diff }}
    env:
      # On a push, the manifest at the previous tip of the branch
      AGAINST: ${{ inputs.against || format('https://raw.githubusercontent.com/{0}/{1}/manifest/v3/manifest.json', github.repository, github.event.before) }}
    steps:
      - uses: actions/checkout@v5
      # Clients older than the v3 endpoint read this file, so it stays byte-for-byte as recorded.
      - name: Check the legacy manifest is unchanged
        run: sha256sum -c manifest/channel-manifest.json.sha256
      - name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version
      - uses: taiki-e/install-action@cargo-make
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-manifest
      - name: Check the channel manifest is formatted
        run: cargo make check-manifest-format
      - name: Validate the channel manifest
        run: cargo make check-manifest
      # `--online` checks upstream only what differs from the manifest being replaced, so a change
      # that leaves the manifest alone makes no requests.
      - name: Check the manifest against the one it replaces
        # A push that creates the branch has no previous tip to compare against.
        if: inputs.against != '' || github.event.before != '0000000000000000000000000000000000000000'
        run: cargo make check-manifest --against "${AGAINST}" --online
      - name: Summarize the changes to the manifest
        id: diff
        if: inputs.against != '' || github.event.before != '0000000000000000000000000000000000000000'
        # Last, so it only summarizes a manifest that passed every check; a failure is read in the
        # log instead. Not through cargo make, which prints its environment to stdout. Also an
        # output, which ci.yml posts on the pull request.
        run: |
          set -euo pipefail
          cargo run -q -p manifest-utils -- diff --manifest-path manifest/v3/manifest.json "${AGAINST}" > "${RUNNER_TEMP}/diff.md"
          cat "${RUNNER_TEMP}/diff.md" >> "${GITHUB_STEP_SUMMARY}"
          delimiter="diff-$(openssl rand -hex 8)"
          {
            echo "diff<<${delimiter}"
            cat "${RUNNER_TEMP}/diff.md"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
