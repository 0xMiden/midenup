name: Publish midenup manifest to Github Pages

on:
  push:
    branches:
      - main
    paths:
      - manifest/**

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Same as ci.yml, so this run reads the cache its unit tests save on main
  RUST_CACHE_KEY: rust-cache-20260312

jobs:
  check-manifest:
    name: check manifest
    uses: ./.github/workflows/check-manifest.yml
    with:
      # The manifest users are fetching right now, which is what this push replaces: a push
      # whose deployment failed never reached them. A downgrade was acknowledged by label on
      # the pull request, so it is allowed here.
      against: https://0xmiden.github.io/midenup/channel-manifest.json
      allow-downgrade: true

  prerelease-test:
    name: pre-release checks
    # Installs real components from this manifest and runs them, so it takes many minutes
    needs: check-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version
      - uses: taiki-e/install-action@cargo-make
      - name: Install all rustup toolchains present in the manifest
        run: |
          ./.github/auxiliary_scripts/install-toolchains.sh
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # ci.yml's `${{ github.workflow }}-shared-tests`, spelled out since this workflow has
          # another name. Read only: the unit tests there persist it.
          shared-key: CI-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Check
        run: cargo make test-build
      - name: Test
        run: cargo make prerelease-test

  upload-manifest:
    name: upload manifest
    needs: [check-manifest, prerelease-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Upload manifest.json
        id: deployment
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: manifest/

  deploy:
    name: Deploy github page containing midenup manifest
    needs: upload-manifest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Run smoke tests
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    # A called workflow can only *downgrade* the calling job's token, so this
    # grant is the ceiling for every job in `smoke.yml`. Without it the
    # job inherits the top-level permissions and the call is rejected as an escalation
    # when the run graph is built -- which fails the whole run before any job
    # starts, rather than failing this one.
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    with:
      release: latest
