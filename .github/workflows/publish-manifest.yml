name: Publish midenup manifest to Github Pages

on:
  push:
    branches:
      - main
    paths:
      - manifest/**

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  upload-manifest:
    name: upload manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Upload manifest.json
        id: deployment
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: manifest/

  deploy:
    name: Deploy github page containing midenup manifest
    needs: upload-manifest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Run smoke tests
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    # A called workflow can only *downgrade* the calling job's token, so this
    # grant is the ceiling for every job in `smoke.yml`. Without it the
    # job inherits the top-level permissions and the call is rejected as an escalation
    # when the run graph is built -- which fails the whole run before any job
    # starts, rather than failing this one.
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    with:
      release: latest
