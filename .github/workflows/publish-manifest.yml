name: Publish midenup manifest to Github Pages

on:
  push:
    branches:
      - main
    paths:
      - manifest/**

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-manifest:
    name: check manifest
    # A called workflow can only downgrade the calling job's token.
    permissions:
      contents: read
    uses: ./.github/workflows/check-manifest.yml
    with:
      # The manifest this push replaces, so nothing that fails the comparison is deployed.
      against: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.before }}/manifest/v3/manifest.json

  acceptance:
    name: acceptance tests (${{ matrix.os }})
    # Every scenario in acceptance/ against every network's toolchain, on both targets midenup is
    # released for. Scenarios that need Docker are skipped on macOS, which lacks it.
    needs: check-manifest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cleanup-runner
      - name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version
      - name: Install all rustup toolchains present in the manifest
        run: |
          ./.github/auxiliary_scripts/install-toolchains.sh
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: CI-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: litcheck
      - name: Acceptance tests
        run: |
          cargo build -p midenup -p acceptance
          ./target/debug/acceptance --midenup target/debug/midenup

  upload-manifest:
    name: upload manifest
    needs: [check-manifest, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Upload manifest.json
        id: deployment
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: manifest/

  deploy:
    name: Deploy github page containing midenup manifest
    needs: upload-manifest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Run smoke tests
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    # A called workflow can only *downgrade* the calling job's token, so this
    # grant is the ceiling for every job in `smoke.yml`. Without it the
    # job inherits the top-level permissions and the call is rejected as an escalation
    # when the run graph is built -- which fails the whole run before any job
    # starts, rather than failing this one.
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    with:
      release: latest
