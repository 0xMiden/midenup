# Released midenup binaries against a candidate commit: homes they built upgrade cleanly, they
# still read the candidate manifest, and those with the home format guard refuse newer homes.
# The releases come from live GitHub release metadata.
name: released-binaries

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to test.
        required: true
        type: string

permissions:
  contents: read

jobs:
  released:
    name: released binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version

      - name: Test against every release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo test --locked --test upgrade --test released --no-run

          # The newest release without the home format guard.
          unguarded=1.3.0
          min=$(jq -r .min_client_version manifest/v3/manifest.json)
          tags=$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-pre-releases \
            --exclude-drafts --limit 100 --json tagName --jq '.[].tagName')
          if [ -z "${tags}" ]; then
            echo "no published midenup release found" >&2
            exit 1
          fi
          # Whether version $1 is at least $2.
          at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]; }

          upgrade=0 client=0 guard=0
          for tag in ${tags}; do
            version=${tag#v}
            dir="${RUNNER_TEMP}/released/${tag}"
            mkdir -p "${dir}"
            echo "::group::${tag}"
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "midenup-${TARGET}.tar.gz" --output - | tar xz -C "${dir}"
            MIDENUP_UPGRADE_FROM="${dir}/midenup" cargo test --locked --test upgrade
            upgrade=$((upgrade + 1))
            if at_least "${version}" "${min}"; then
              MIDENUP_RELEASED_CLIENT="${dir}/midenup" cargo test --locked --test released
              client=$((client + 1))
            fi
            if [ "${version}" != "${unguarded}" ] && at_least "${version}" "${unguarded}"; then
              MIDENUP_GUARDED_RELEASE="${dir}/midenup" cargo test --locked --test released
              guard=$((guard + 1))
            fi
            echo "::endgroup::"
          done

          {
            echo "### Released binaries on ${TARGET}"
            echo
            echo "| Gate | Releases tested |"
            echo "| --- | --- |"
            echo "| Upgrade a released home | ${upgrade} |"
            echo "| Read the candidate manifest (min_client_version ${min}) | ${client} |"
            echo "| Refuse a newer home format | ${guard} |"
            echo
            echo "Elapsed: $(( $(date +%s) - start ))s, including the test build."
          } >> "${GITHUB_STEP_SUMMARY}"
