# Reviewed release-candidate declaration.
#
# Production reads its scope and versions from this file and nothing else;
# workflow inputs cannot widen or narrow it. Generated by `release-tool
# set-version`, then reviewed and merged like any other change.

schema-version = 1
units = [
    "main",
]

[main]
version = "1.0.0"
tag = "v1.0.0"
prerelease = false
